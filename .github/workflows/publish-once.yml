name: publish once
on:
  push:
    paths:
      - .github/workflows/publish-once.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unpack
        run: |
          set -euo pipefail
          curl -fsSL -o site.zip "https://tmpfiles.org/dl/1793531134.03e7b18247c04bbe/wAAoTtpjWpWY/site-nov1.zip"
          unzip -t site.zip
          unzip -o site.zip -d "$GITHUB_WORKSPACE"
          rm -f site.zip
          git config user.name "Artsiom Dubrounik"
          git config user.email "fooooxmr@gmail.com"
          git add elektro.html dzhip.html index.html README.md assets/site.css svezhie.html sravnenie.html bak.html osmotr.html mashina
          git rm -f .github/workflows/publish-once.yml
          git commit -m "feat: add electric cars and separate jeep pages"
          git push
