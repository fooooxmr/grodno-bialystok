name: publish once

on:
  push:
    paths:
      - .github/workflows/publish-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site and remove this workflow
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/site.zip "https://tmpfiles.org/dl/1793350880.483a5000613d9f06/wCAAHV4u7KV5/site25.zip"
          unzip -t /tmp/site.zip
          unzip -o /tmp/site.zip -d "$GITHUB_WORKSPACE"
          git config user.name "Artsiom Dubrounik"
          git config user.email "fooooxmr@gmail.com"
          git add index.html svezhie.html sravnenie.html README.md mashina
          git rm -f .github/workflows/publish-once.yml
          git commit -m "feat: widen the buying budget to 25 thousand dollars"
          git push
