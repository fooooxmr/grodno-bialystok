name: publish once
on:
  push:
    paths:
      - .github/workflows/publish-once.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unpack site
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793475766.1808fe2e0d25722b/wgA4TUCmI8P3/dzhip-site.zip" -o /tmp/site.zip
          unzip -t /tmp/site.zip
          unzip -o /tmp/site.zip -d "$GITHUB_WORKSPACE"
          git config user.name "Artsiom Dubrounik"
          git config user.email "fooooxmr@gmail.com"
          git add dzhip.html index.html README.md svezhie.html sravnenie.html bak.html osmotr.html mashina
          git rm -f .github/workflows/publish-once.yml
          git commit -m "feat: add a diesel jeep page up to 20 thousand dollars"
          git push
